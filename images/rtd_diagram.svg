<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" version="1.1">
  <defs>
    <pattern id="packing" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#9fb4c7"/>
      <circle cx="13" cy="10" r="2" fill="#9fb4c7"/>
      <circle cx="6" cy="15" r="1.6" fill="#b7c8d6"/>
      <circle cx="16" cy="3" r="1.6" fill="#b7c8d6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#16324F">
    <text x="24" y="30" font-size="15" font-weight="bold">P&amp;ID — Experiencia 3: Ensayo de Trazador (RTD)</text>

    <!-- Feed water line: tank -> FIC-101 -> column base -->
    <rect x="30" y="392" width="46" height="56" rx="4" fill="#dce8f2" stroke="#16324F" stroke-width="2"/>
    <text x="53" y="422" font-size="10" text-anchor="middle">Agua</text>
    <text x="53" y="434" font-size="10" text-anchor="middle">Feed</text>

    <line x1="76" y1="420" x2="110" y2="420" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arrow)"/>

    <circle cx="140" cy="420" r="24" fill="#ffffff" stroke="#16324F" stroke-width="2"/>
    <text x="140" y="417" font-size="10" text-anchor="middle" font-weight="bold">FIC</text>
    <text x="140" y="429" font-size="10" text-anchor="middle">101</text>

    <line x1="164" y1="420" x2="300" y2="420" stroke="#2b6cb0" stroke-width="3"/>

    <!-- Tracer injection point (pulse syringe + step 3-way valve, both feeding the same tee) -->
    <circle cx="300" cy="420" r="5" fill="#16324F"/>
    <line x1="300" y1="415" x2="300" y2="370" stroke="#5c4a8a" stroke-width="2.5"/>

    <!-- syringe icon (pulse) -->
    <rect x="266" y="330" width="34" height="14" rx="2" fill="#efe8f7" stroke="#5c4a8a" stroke-width="1.6"/>
    <line x1="252" y1="337" x2="266" y2="337" stroke="#5c4a8a" stroke-width="2"/>
    <text x="283" y="356" font-size="9.5" text-anchor="middle" fill="#5c4a8a">Pulso</text>

    <!-- three-way valve icon (step) -->
    <rect x="304" y="330" width="18" height="18" transform="rotate(45 313 339)" fill="#efe8f7" stroke="#5c4a8a" stroke-width="1.6"/>
    <text x="335" y="341" font-size="9.5" fill="#5c4a8a">Escalón</text>

    <text x="300" y="318" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#5c4a8a">TI-201 — Inyección de trazador</text>

    <!-- Main feed line continues to column base -->
    <line x1="300" y1="420" x2="420" y2="420" stroke="#2b6cb0" stroke-width="3"/>
    <line x1="420" y1="420" x2="420" y2="402" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Packed bed column R-201 -->
    <rect x="368" y="86" width="104" height="316" rx="6" fill="url(#packing)" stroke="#16324F" stroke-width="2.5"/>
    <rect x="368" y="86" width="104" height="316" rx="6" fill="none" stroke="#16324F" stroke-width="2.5"/>
    <text x="420" y="70" font-size="13" text-anchor="middle" font-weight="bold">R-201</text>
    <text x="420" y="454" font-size="10" text-anchor="middle">Lecho Empacado</text>

    <!-- Column outlet -> AIT-201 -> drain -->
    <line x1="420" y1="86" x2="420" y2="60" stroke="#2b6cb0" stroke-width="3"/>
    <line x1="420" y1="60" x2="600" y2="60" stroke="#2b6cb0" stroke-width="3"/>
    <line x1="600" y1="60" x2="600" y2="88" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arrow)"/>

    <circle cx="600" cy="118" r="24" fill="#ffffff" stroke="#16324F" stroke-width="2"/>
    <text x="600" y="115" font-size="10" text-anchor="middle" font-weight="bold">AIT</text>
    <text x="600" y="127" font-size="10" text-anchor="middle">201</text>
    <text x="600" y="152" font-size="9.5" text-anchor="middle">Fotocolorímetro</text>

    <line x1="600" y1="142" x2="600" y2="180" stroke="#2b6cb0" stroke-width="3"/>
    <line x1="600" y1="180" x2="700" y2="180" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="700" y="196" font-size="10" text-anchor="end">Drenaje</text>

  </g>
</svg>
